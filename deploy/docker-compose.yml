# PlayMatch — single-VPS stack (OVH vps2-2027, aiplaymatch.com)
# Phase 2: caddy + app + postgres. Ollama arrives in Phase 5.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    # /tmp is noexec so a dropped payload can't be run from it.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # needs to bind :80/:443
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UPLOAD_DIR: /app/uploads
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
    volumes:
      - uploads:/app/uploads
    # The 2026-08-10 compromise wrote every payload to /tmp and executed it
    # there (miner, watchdogs, dropper). noexec breaks that whole chain.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL] # the Node server needs no Linux capabilities
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # Keep the model resident in RAM so Rally has no cold-start (~4 GB pinned;
      # the box has headroom). Default is unload after 5 min idle.
      OLLAMA_KEEP_ALIVE: "-1"
    # CPU inference; cap memory so a spike can't OOM the app/db.
    deploy:
      resources:
        limits:
          memory: 6g
    # Larger than the others: model loading is temp-file heavy. If Rally ever
    # stops responding after a change here, check whether the Ollama version
    # extracts and execs its runner from a temp dir — set OLLAMA_TMPDIR to a
    # writable, exec-permitted path if so. (Current version runs the runner
    # from /usr/lib/ollama, so noexec is fine.)
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    expose:
      - "11434"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: playmatch
      POSTGRES_USER: playmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Postgres uses /var/run/postgresql for its socket, not /tmp, so noexec here
    # is safe and does not affect pg_dump backups.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playmatch -d playmatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  pg_data:
  uploads:
  ollama_models:
